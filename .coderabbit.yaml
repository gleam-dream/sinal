# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Review policy for sinal, derived by the coderabbit-config skill.
# Each instruction names the skill it comes from; `policy` is the review policy
# of coderabbit-config itself, and `repository` marks a rule beyond the catalog.
#
# Catalogs read:
#   practice catalog (not public)  879841a61c3f83cd809edca9229c4a6bb7f909f8
#   gleam-agent-tools  6a9ea2f647e787a32d3c7fa88d9c58c5b81ae9d7
#
# Governing skills: coderabbit-config (policy), gleam, gleam-lib, gleam-ffi,
# gleam-otp, sinal, testing, python, design, tracker, gate, git.
#
# Governing dependency versions: sinal 0.1.0 (this package, gleam.toml).
# Locked in manifest.toml: telemetry 1.4.2, gleam_otp 1.3.0,
# gleam_erlang 1.3.0, gleam_stdlib 1.0.5, gleeunit 1.11.0.
language: en-US
tone_instructions: >-
  Literal and concise. Report only defects you can evidence from the diff, its
  callers, the design, or a cited rule. One finding per cause. An empty review
  is valid.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Lead with the problem the change solves, then the response in one short
    paragraph, then the public API or native telemetry effect, if any. Do not
    narrate the diff file by file.
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main

  # Rendered design, retained benchmark observations and the Nix lock.
  path_filters:
    - "!flake.lock"
    - "!docs/design/design-layer.pdf"
    - "!docs/benchmarks/**"

  path_instructions:
    - path: "{src,examples}/**"
      instructions: |
        Review policy (policy).
        - Design first. docs/COVERAGE.md maps each part to its owning section in
          docs/design (contexts `observation`, `forwarding` and
          `verification`) and docs/adr. Flag code that contradicts that unit's
          interface, invariants or side effects, and a change to designed
          behavior with no change to its design. A fix that restores designed
          behavior needs none. When code and design disagree, the design
          changes first.
        - Core abstractions. Flag a second representation of a concept the
          design names (Event, Fields, Subscription, Attachment, subscription
          scope, Correlation, span, Forwarder, route), a name that differs from
          the CONTEXT.typ glossaries, and a public module that reaches into
          `sinal/internal` past the interface that owns it.
        - Lean. Flag code no test, caller or unit needs: an unset option, an
          unvaried parameter, a wrapper that adds no rule, an unreachable
          branch. Say what to delete.
        - Migration, never a legacy path. Flag a compatibility shim, a fallback
          to an old format, a dual read or write, a deprecated alias, and a
          flag that keeps old behavior. A change to a public module ships as a
          breaking release with a migration note.
        - Composable. In a public module, flag hidden call ordering, global
          state beyond the native telemetry registry and the node-wide routes
          the design names, a mandatory framework where functions compose, a
          concept the common caller must learn and does not need, and a module
          with two responsibilities.
        - Test first. Flag a behavior change with no test that exercises it,
          and a test bound to internals.
        - Typed before foreign. Flag Erlang where Gleam does the job, an
          unchecked cast, an untyped native map that reaches domain logic
          undecoded, and a crash on a routine failure. A panic on an invalid
          source definition is designed (ADR 0002).
        - Silence. Report nothing that `gleam format`, the compiler with
          warnings as errors, `erlc -Werror`, the tests or `sh dev/test`
          decide, and no layout or naming preference without a written rule.

    - path: "{src,test,examples}/**/*.gleam"
      instructions: |
        Gleam (gleam).
        - Flag a module function, private included, without annotated
          arguments and return type, and an imported function or constant used
          unqualified.
        - Flag a name against the conventions: `Json` not `JSON`,
          conversions named `x_to_y` or `to_y` inside module `x`, `try_` only
          for an error-propagating counterpart.
        - Flag `Option` carrying a failure, and a change that merges omitted,
          explicit false, empty and failed where they mean different things.
        - Flag an error a caller must parse as a string to choose recovery;
          the `describe_*` functions render a typed error, they do not replace
          it.
        - Flag independent optional fields or booleans standing for exclusive
          states; they are variants.
        - Flag a predicate check followed by `let assert` on the same shape,
          and a catch-all branch that silently accepts a new variant.
        - Flag `panic` or `let assert` handling a routine external failure in
          `src/`, such as a malformed native map or a missing process.
        - Flag a refactor that changes observable errors, ordering or effects.
        - Flag a compatibility branch with no comment saying why it exists.
        - Flag `src/` importing a `test/` or `dev/` module or `gleeunit`.
        - Flag a new process, module or generic machinery added only for
          organization, and a local type replacing a compatible ecosystem type.

    - path: "src/**/*.gleam"
      instructions: |
        Published library surface (gleam-lib). Exported constructors, fields,
        variants, module paths and behavior of `sinal`, `sinal/fields`,
        `sinal/correlation`, `sinal/span` and `sinal/forwarder` are the
        compatibility surface; `internal_modules` in gleam.toml marks
        instability, not access control.
        - Flag a removed or changed export, variant, field or behavior in a
          public module that the pull request does not call breaking.
        - Flag a public signature that exposes an implementation-state type
          parameter.
        - Flag an argument that does not affect behavior, a bound operation
          that makes callers repeat an event name or its codecs at each use, a
          setter per field where a record update works, and two public paths
          for one common task.
        - Flag configuration validated after a resource is allocated, such as
          forwarder capacity checked after the process starts, and a builder
          or extension protocol with no distinct use case.
        - Flag a dynamic dispatcher over heterogeneous parameters where typed
          operations can be bound.
        - Flag a deliberate crash on a failure the caller could act on; return
          a structured error instead.
        - Flag the library taking over policy that belongs to the application:
          exporting, aggregation, persistence or retention (ADR 0013).

    - path: "{src,test}/**/*.{gleam,erl}"
      instructions: |
        Foreign boundaries (gleam-ffi). Apply to `*.erl` files and to a Gleam
        module that declares `@external`.
        - Flag validation, branching or state transitions in Erlang that the
          design gives to Gleam; foreign code performs the native call, the
          representation conversion and the native sequencing that must stay
          atomic.
        - Flag an external that declares a native value to be a checked domain
          value, `Dynamic` or a type variable that accepts every handle, and a
          generic return that hides an unchecked cast.
        - Flag Erlang that builds a Gleam `Result`, list or variant with a
          shape that differs from the compiler's documented representation.
        - Flag an expected native failure not mapped to the declared failure
          value, and code that assumes Gleam catches a foreign exception.
        - Flag a handle, registration or monitor whose owner and cleanup the
          change leaves unstated.
        - Flag a JavaScript external; the package targets Erlang only (ADR
          0012).
        - Flag a foreign function with no remaining caller.

    - path: "src/**/*.{gleam,erl}"
      instructions: |
        Processes (gleam-otp; gleam_otp 1.3.0, gleam_erlang 1.3.0). Apply to
        `src/sinal/forwarder.gleam`, `src/sinal_forwarder_ffi.erl` and any
        module that imports `gleam/otp/actor`, `gleam/otp/supervision` or
        `gleam/erlang/process`.
        - Flag slow handler work in the coordinator that must stay responsive
          to admission, route updates or shutdown.
        - Flag accepted work, waiting messages or active workers with no bound.
        - Flag a subject received from outside its owning process.
        - Flag `process.call` treated as returning a timeout `Error` or as
          proof that the request had no effect.
        - Flag a message, spawn closure or start argument that captures a
          large term where an id or reference would do.
        - Flag a supervisor restart that leaves an earlier subject or
          incarnation addressing an exited process (ADR 0008).
        - Flag a process name or atom created from unbounded input.
        - Flag a link, monitor or supervision used where the design names
          another, and a worker failure whose propagation to the caller is
          left undecided.

    - path: "{src,examples}/**/*.gleam"
      instructions: |
        Sinal telemetry (sinal; rules for 0.1.0 on telemetry 1.4.2).
        - Flag an event name, field key or route prefix built from a runtime
          value; each creates a permanent atom (AGENTS.md). Request ids and
          other unbounded values go in metadata values.
        - Flag an event defined twice instead of one definition reused by its
          emitters and observers, and record fields composed without
          `fields.include` and `fields.success`.
        - Flag a custom getter or encoder that can fail or raise; encoding
          runs in the producer before dispatch, with or without observers.
        - Flag an attachment that is never detached, and temporary
          registrations made without a subscription scope.
        - Flag a handler id built per call where a stable id is needed, and a
          stable id reused where a replacement could be addressed by an old
          attachment.
        - Flag an unrouted handler that does I/O, a database write or a
          network call; it runs synchronously in the emitting process.
        - Flag an enum field codec whose constructor list can miss a variant.
        - Flag a change that treats every skipped occurrence as a detached
          handler; malformed data skips the occurrence and keeps the
          registration, while a callback failure removes it.
        - Flag routes changed per request, an inline fallback or retry when a
          forwarder is full or unavailable, and a claim that shutdown drains.
        - Flag forwarder acceptance or a drop report used as a durable
          receipt, and telemetry used to decide whether a business commit
          happened.
        - Flag forwarded handler code that reads the producer's process
          dictionary or process identity, and a claim of global ordering from
          per-producer FIFO.
        - Flag a span around more than one local call, a returned `Error`
          reported as a span exception, and a native duration converted
          without an explicit unit.
        - Flag correlation used as trace parentage or authorization.

    - path: "{test,examples/usage/test}/**"
      instructions: |
        Tests (testing).
        - Flag a test that confirms success through internals, private state
          or a side channel where the public API can show it.
        - Flag a mock of an internal collaborator, and an assertion on call
          counts or call order.
        - Flag a scenario outcome that no design rule states, and a change to
          the native oracle cases that docs/ORACLE.md does not record.
        - Flag tests left in place for an interface the diff replaced.
        - Flag a refusal or illegal input the change introduces with no test
          through the public boundary.
        - Flag a sleep that establishes race ordering instead of a
          synchronization barrier, and an attachment a test leaves attached
          (AGENTS.md).
        - Flag a test that asserts a latency or benchmark threshold
          (AGENTS.md, ADR 0015).

    - path: "dev/**/*.py"
      instructions: |
        Python race probe (python).
        - Flag `Any`, and an external value (file, process output, argument)
          used without parsing.
        - Flag an abstract base class hierarchy; use `Protocol`.
        - Flag mutable dataclasses inside the program, and exclusive states as
          flags instead of tagged frozen dataclasses matched with
          `assert_never`.
        - Flag a parser model passed past the boundary.

    - path: "docs/{design,adr}/**"
      instructions: |
        Design layer (design; policy).
        - Fresh reader. The reviewer never saw the change being made. Flag a
          changed unit that does not tell a reader with no memory what the
          code does not say, and a unit that copies the code.
        - Flag content the code states: payloads, fields, limits, timeouts,
          function or file lists, queries. Name the rule it serves instead; a
          file or symbol is allowed only where a reader needs it to find where
          a rule is enforced.
        - Flag session narration, progress notes, status or delivery history.
        - Flag a unit missing one of overview, interface, invariants, side
          effects and verification; an empty part says "none".
        - Flag a concept defined in a second home, a glossary term with two
          meanings, and a retired term reused.
        - Flag an edit to an accepted ADR's text instead of a superseding ADR,
          and a changed date on a pending entry.

    # issues/ is the tracker home AGENTS.md declares; it holds no issue yet.
    - path: "issues/**/*.md"
      instructions: |
        Local tracker (tracker; AGENTS.md).
        - Each issue file carries one `Status:` and one `Category:` header
          with a value AGENTS.md lists.
        - Flag an issue titled with a solution instead of the observable
          problem, line numbers or solution code in an issue, and a horizontal
          task such as "build the data layer".
        - Flag an AI-written comment that does not start with
          `AI-assisted contribution.`

    - path: "{dev/test,flake.nix,lefthook.yml,.github/workflows/**}"
      instructions: |
        Gate (gate).
        - Flag a check that passes or skips when its tool is missing; it
          fails or reports unmeasured.
        - Flag a tool not supplied through the Nix flake, and a command that
          differs between local runs and CI.
        - Flag a new check that encodes a layout, naming or README
          convention, and a check that scripts what a tool already performs
          (ADR 0015).
        - Flag a replaced check that drops security or data-integrity
          coverage.
        - Flag a gate that keeps a formatting check but loses the compile
          step, the native `erlc -Werror` build, `gleam test`, the usage
          examples or the full-profile race checks.

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    docstrings:
      mode: "off"
    custom_checks:
      - name: No weakened test or gate
        mode: error
        instructions: |
          Source: policy, gate. Fail if the diff skips, deletes, disables or
          loosens a test, a native oracle case, a race scenario of
          dev/check_forwarder.py or a step of dev/test or CI (including
          removing a step from the `full` profile, dropping the usage
          examples, or adding `continue-on-error`), and the pull request
          description does not name the behavior that no longer exists or the
          stronger check that replaces it. Pass otherwise.
      - name: Behavior change carries its design
        mode: warning
        instructions: |
          Source: policy, design. Warn if the diff changes public behavior or
          an invariant in src/ with no change under docs/design or docs/adr,
          and the pull request description does not say the change restores
          designed behavior or preserves behavior. Pass for tests, tooling and
          documentation-only changes.
      - name: Breaking change is declared
        mode: warning
        instructions: |
          Source: policy, gleam-lib. Warn if the diff removes or changes an
          exported function, type, constructor, field or module path in a
          module outside `sinal/internal`, and the pull request description
          does not call the change breaking and give its migration. Pass
          otherwise.
      - name: Problem-first description
        mode: warning
        instructions: |
          Source: git. Warn unless the pull request description gives the
          problem, why it matters, one concrete example, the solution in one
          paragraph, its trade-offs, and what was verified, with no file
          tour, and its claims match the diff.
      - name: No attribution text
        mode: warning
        instructions: |
          Source: git. Warn if the pull request title or description contains
          a co-author credit, `Co-Authored-By`, a "Generated with" or
          "Generated by" line, or a line starting with the robot emoji.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  tools:
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    # Ruff is the repository's Python linter (ruff.toml). It runs no other
    # Python, JavaScript, Markdown, YAML or prose linter; their findings would
    # be preferences without a written rule (policy, Silence).
    pylint:
      enabled: false
    flake8:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    # AGENTS.md and CLAUDE.md are read by default.
    filePatterns:
      - files: "docs/COVERAGE.md,docs/CONTEXT-MAP.md,docs/design/**/*.typ,docs/adr/*.md"
        applyTo: "src/**,examples/**,test/**"
      - files: "docs/ORACLE.md"
        applyTo: "test/**,src/**/*.erl"
  learnings:
    scope: local
  pull_requests:
    scope: local
