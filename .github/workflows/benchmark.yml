name: Benchmark observations
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Observe benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix develop --command gleam run -m benchmark
